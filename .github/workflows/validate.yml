name: Validate source

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: compile · unit tests · JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies (hash-locked)
        run: |
          uv venv --python 3.12
          uv pip install --require-hashes -r requirements.txt

      - name: Byte-compile
        run: .venv/bin/python -m py_compile app/*.py

      - name: Unit tests (all waves)
        env:
          GOBLINDOCK_DEV: "1"
        run: |
          for t in tests/test_wave*.py; do
            echo "== $t =="
            .venv/bin/python "$t"
          done

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "20"

      - name: JS syntax and UI behavior
        run: |
          js_files=(web/*.js tests/test_wave*_ui.js)
          for f in "${js_files[@]}"; do node --check "$f"; done
          for t in tests/test_wave*_ui.js; do node "$t"; done
