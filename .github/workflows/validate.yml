name: Validate source

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: compile · unit tests · JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install dependencies (hash-locked)
        run: |
          uv venv --python 3.12
          uv pip install --require-hashes -r requirements.txt

      - name: Byte-compile
        run: .venv/bin/python -m py_compile app/*.py

      - name: Unit tests (all waves)
        env:
          GOBLINDOCK_DEV: "1"
        run: |
          for t in tests/test_wave*.py; do
            echo "== $t =="
            .venv/bin/python "$t"
          done

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"

      - name: JS syntax and UI behavior
        run: |
          js_files=(web/*.js tests/test_wave*_ui.js)
          for f in "${js_files[@]}"; do node --check "$f"; done
          for t in tests/test_wave*_ui.js; do node "$t"; done
