name: Validate source

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: compile · unit tests · JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies (hash-locked)
        run: |
          uv venv --python 3.12
          uv pip install --require-hashes -r requirements.txt

      - name: Byte-compile
        run: .venv/bin/python -m py_compile app/*.py

      - name: Unit tests (all waves)
        env:
          GOBLINDOCK_DEV: "1"
        run: |
          for t in tests/test_wave*.py; do
            echo "== $t =="
            .venv/bin/python "$t"
          done

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "20"

      - name: JS syntax and UI behavior
        run: |
          js_files=(web/*.js tests/test_wave*_ui.js)
          for f in "${js_files[@]}"; do node --check "$f"; done
          for t in tests/test_wave*_ui.js; do node "$t"; done
