name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  test:
    # Preserve the branch-protection context while sharing validation with publishing.
    name: compile · unit tests · JS syntax
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require complete validation
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success

  docker:
    name: docker build (verify Dockerfile)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: goblindock:pr-${{ github.event.pull_request.number || 'ci' }}
          build-args: GOBLINDOCK_BUILD=pr-${{ github.event.pull_request.number || 'ci' }}@${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container startup
        env:
          IMAGE: goblindock:pr-${{ github.event.pull_request.number || 'ci' }}
        run: |
          docker run -d --name gd-smoke -e GOBLINDOCK_DEV=1 -p 127.0.0.1:8080:8080 "$IMAGE"
          trap 'docker logs gd-smoke; docker rm -f gd-smoke' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Export test image
        env:
          IMAGE: goblindock:pr-${{ github.event.pull_request.number || 'ci' }}
        run: docker save "$IMAGE" | gzip > goblindock-test-image.tar.gz
      - name: Upload test image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goblindock-test-image-${{ github.event.pull_request.number || 'ci' }}
          path: goblindock-test-image.tar.gz
          retention-days: 14
          compression-level: 0
